spring:
  application:
    name: message-broker

  # Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/webbanking
    username: webbanking_user
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  # Component Scanning Configuration
  main:
    allow-bean-definition-overriding: true

  # Kafka Configuration
  kafka:
    bootstrap-servers: kafka-broker1:9092,kafka-broker2:9092,kafka-broker3:9092
    topics:
      transaction: banking.transactions
      transfer-debited: transfer.debited
      transaction-logged: transaction.logged
      transfer-failed: transfer.failed
      notification: banking.notifications
      user-activity: user-activity-topic
      analytics: banking.analytics
      fraud-alert: banking.fraud.alerts
      audit-log: banking.audit.logs
      dead-letter: banking.dead-letter.queue
    consumer:
      group-id: message-broker-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: service.messagebroker.models
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    streams:
      application-id: transaction-processor-app
      replication-factor: 3
      num-stream-threads: 8
      state-dir: /data/kafka-streams

app:
  transaction:
    international:
      risk-threshold: 7.5            # Risk threshold for international transactions
    high-value:
      threshold: 10000.0             # Threshold for high-value transactions
    spending:
      alert-threshold: 5000.0        # Default spending alert threshold

  # User Settings Configuration
  user-settings:
    cache-ttl-minutes: 15            # Cache time-to-live for user settings

  # Streams Configuration
  streams:
    aggregation:
      window-size: PT1H              # 1-hour window size for aggregation
