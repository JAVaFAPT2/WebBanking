syntax = "proto3";

option csharp_namespace = "Presentation.Protos";

package account;

service AccountService {
  // Create a new account
  rpc CreateAccount (CreateAccountRequest) returns (CreateAccountResponse);
  
  // Get account by ID
  rpc GetAccount (GetAccountRequest) returns (AccountResponse);
  
  // Get accounts by user ID
  rpc GetUserAccounts (GetUserAccountsRequest) returns (GetUserAccountsResponse);
  
  // Update account balance
  rpc UpdateBalance (UpdateBalanceRequest) returns (UpdateBalanceResponse);
  
  // Close account
  rpc CloseAccount (CloseAccountRequest) returns (CloseAccountResponse);
  
  // Block/Unblock account
  rpc BlockAccount (BlockAccountRequest) returns (BlockAccountResponse);
}

message CreateAccountRequest {
  string user_id = 1;
  string account_type = 2;
  Money initial_balance = 3;
}

message CreateAccountResponse {
  string account_id = 1;
  string account_number = 2;
}

message GetAccountRequest {
  string account_id = 1;
}

message GetUserAccountsRequest {
  string user_id = 1;
}

message GetUserAccountsResponse {
  repeated AccountResponse accounts = 1;
}

message AccountResponse {
  string account_id = 1;
  string user_id = 2;
  string account_number = 3;
  string account_type = 4;
  Money balance = 5;
  string status = 6;
  string currency = 7;
  string created_at = 8;
  string last_modified_at = 9;
}

message UpdateBalanceRequest {
  string account_id = 1;
  Money amount = 2;
  string transaction_type = 3;
}

message UpdateBalanceResponse {
  bool success = 1;
}

message CloseAccountRequest {
  string account_id = 1;
}

message CloseAccountResponse {
  bool success = 1;
}

message BlockAccountRequest {
  string account_id = 1;
  bool block = 2;
  string reason = 3;
}

message BlockAccountResponse {
  bool success = 1;
}

message Money {
  string currency = 1;
  int64 amount = 2;  // Amount in smallest currency unit (e.g., cents)
} 