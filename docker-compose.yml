services:
  # API Gateway
  api-gateway:
    build: 
      context: ./ApiGateWay
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_ENABLED=true
      - SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_LOWERCASE_SERVICE_ID=true
      - SERVER_PORT=8081
      - MANAGEMENT_SERVER_PORT=8081
      - MANAGEMENT_ENDPOINTS_WEB_BASE_PATH=/actuator
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
      - user-service
      - account-service
      - orchestration-service
      - keycloak
    networks:
      - webbanking-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Orchestration Service
  orchestration-service:
    build: 
      context: ./OrchestrationService
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      - kafka
      - db
      - keycloak
    networks:
      - webbanking-network

  # Account Service
  account-service:
    build: 
      context: ./AccountService
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - AccountServiceSettings__Database__ConnectionString=Server=db;Database=AccountService_db;Uid=root;Pwd=root_password;
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      - kafka
      - db
    networks:
      - webbanking-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Card Service
  card-service:
    build: 
      context: ./CardService
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      - kafka
      - db
      - redis
      - keycloak
    networks:
      - webbanking-network

  # Loan Service
  loan-service:
    build: 
      context: ./LoanService
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      - kafka
      - db
      - redis
      - keycloak
    networks:
      - webbanking-network

  # Notification Service
  notification-service:
    build: 
      context: ./NotificationService
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      - kafka
      - db
      - keycloak
    networks:
      - webbanking-network

  # User Service
  user-service:
    build: 
      context: ./UserService
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      - kafka
      - db
      - redis
      - keycloak
    networks:
      - webbanking-network
    dns:
      - 127.0.0.11
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "5001:5001"

  # Fund Transfer Service
  fund-transfer-service:
    build: 
      context: ./FundTransferService
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      - kafka
      - db
      - redis
      - keycloak
    networks:
      - webbanking-network

  # Transaction Service
  transaction-service:
    build: 
      context: ./TransactionService
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
      - db
      - redis
    networks:
      - webbanking-network

  # Caching Service
  caching-service:
    build: 
      context: ./caching-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - redis
    networks:
      - webbanking-network

  # Monitor Service
  monitor-service:
    build: 
      context: ./monitorService
    ports:
      - "9090:9090" # Prometheus
      - "3000:3000" # Grafana
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - kafka
      - db
    networks:
      - webbanking-network

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.9.1
    hostname: kafka
    user: root
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_MODE: "true"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://webbanking-kafka-1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CLUSTER_ID: "v_ARixrRSDm6Kqp1beRjkA"
      CLUSTER_ID: "v_ARixrRSDm6Kqp1beRjkA"
      KAFKA_LOG_DIRS: "/tmp/kraft-storage"
    volumes:
      - ./custom-entrypoint.sh:/custom-entrypoint.sh
      - kafka-data:/tmp/kraft-storage
    entrypoint: /custom-entrypoint.sh
    networks:
      - webbanking-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis
  redis:
    image: redis:7.0
    ports:
      - "6379:6379"
    networks:
      - webbanking-network

  # Database (MySQL for DD)
  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: DD
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - webbanking-network
    volumes:
      - db_data:/var/lib/mysql

  # Keycloak for authentication
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    ports:
      - "8180:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin_password
      - KC_DB=mysql
      - KC_DB_URL=jdbc:mysql://db:3306/DD?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - KC_DB_USERNAME=root
      - KC_DB_PASSWORD=root_password
      - KC_HTTP_PORT=8080
      - KC_HOSTNAME_STRICT_HTTPS=false
    command:
      - "start-dev"
    networks:
      - webbanking-network
    depends_on:
      - db

volumes:
  db_data:
  kafka-data:

networks:
  webbanking-network:
    driver: bridge 