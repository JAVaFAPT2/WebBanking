syntax = "proto3";

option csharp_namespace = "NotificationService.Presentation.Protos";

package notification;

// The notification service definition.
service Notification {
  // Sends a notification
  rpc SendNotification (SendNotificationRequest) returns (SendNotificationResponse);
}

// The request message containing the notification details.
message SendNotificationRequest {
  string recipient = 1;
  string subject = 2; // Used as Title for Push, Subject for Email
  string body = 3;
  NotificationType type = 4;
  map<string, string> data_payload = 5; // Optional: for Push notifications
}

// The response message confirming the notification sending status.
message SendNotificationResponse {
  bool success = 1;
  string message_id = 2; // Optional: an ID from the notification provider
  string error_message = 3; // Optional: if sending failed
}

// Enum for notification types
enum NotificationType {
  EMAIL = 0;
  SMS = 1;
  PUSH = 2;
} 