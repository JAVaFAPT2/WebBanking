version: '3.8'
services:
  kafka:
    image: confluentinc/cp-kafka:8.7.0          # supports KRaft
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # --- KRaft controller & broker in one
      KAFKA_PROCESS_ROLES: broker,controller  
      KAFKA_NODE_ID: 1                         # unique broker ID
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # cluster metadata (just one node here)
      KAFKA_CLUSTER_ID: $(bash -c "echo $(uuidgen))"
    volumes:
      - kafka-data:/var/lib/kafka/data

  userservice:
    build: .
    ports:
      - "5272:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__Topic=user-events
    depends_on:
      - kafka

volumes:
  kafka-data:
