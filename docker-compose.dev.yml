version: '3.8'

services:
  # API Gateway - Main entry point for mobile app
  api-gateway:
    build: 
      context: ./ApiGateWay
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8081
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=t4whZJUAhgif/tV1Y9b2lB+p7INVKkGKm4EZcxWpvP0=
      - JWT_EXPIRATION=86400
    depends_on:
      - kafka
      - user-service
      - account-service
    networks:
      - webbanking-dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # User Service - Core authentication and user management
  user-service:
    build: 
      context: ./UserService
    ports:
      - "8051:8051"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8051
      - Kafka__BootstrapServers=kafka:9092
      - ConnectionStrings__DefaultConnection=Server=db;Database=webbanking_dev;Uid=root;Pwd=root_password;
      - Redis__ConnectionString=redis:6379,abortConnect=false
    depends_on:
      - kafka
      - db
    networks:
      - webbanking-dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8051/api/User/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Account Service - Account management
  account-service:
    build: 
      context: ./AccountService
    ports:
      - "8052:8052"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8052
      - ConnectionStrings__DefaultConnection=Server=db;Database=webbanking_dev;Uid=root;Pwd=root_password;
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      - kafka
      - db
    networks:
      - webbanking-dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8052/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Kafka - Message broker
  kafka:
    image: confluentinc/cp-kafka:7.9.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_MODE: "true"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CLUSTER_ID: "v_ARixrRSDm6Kqp1beRjkA"
      CLUSTER_ID: "v_ARixrRSDm6Kqp1beRjkA"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-dev-data:/var/lib/kafka/data
    networks:
      - webbanking-dev-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Database - MySQL for all services
  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: webbanking_dev
    networks:
      - webbanking-dev-network
    volumes:
      - db-dev-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis - Caching
  redis:
    image: redis:7.0
    ports:
      - "6379:6379"
    networks:
      - webbanking-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  db-dev-data:
  kafka-dev-data:

networks:
  webbanking-dev-network:
    driver: bridge 